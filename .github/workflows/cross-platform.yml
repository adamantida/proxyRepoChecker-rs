name: cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build.bat windows
      - name: Build release (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build.sh
      - name: Run unit tests
        run: cargo test --workspace

  coverage-and-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nightly coverage toolchain
        run: rustup toolchain install nightly-2026-10-26 --component llvm-tools-preview
      - name: Measure line and branch coverage
        run: cargo +nightly-2026-10-26 llvm-cov --remap-path-prefix --workspace --lib --bins --tests --branch --summary-only --ignore-filename-regex '(^/|.cargo/registry|/benches/)' --fail-under-lines 96
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run mutation tests
        run: CARGO_PROFILE_DEV_DEBUG=0 cargo +stable mutants --workspace --jobs 2 --timeout 120 --minimum-test-timeout 30
