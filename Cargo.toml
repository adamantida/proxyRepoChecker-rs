[workspace]
members = ["proxy-clash", "proxy-singbox"]
resolver = "2"

[package]
name = "proxy-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
colored = "2"
futures = "0.3"
indicatif = "0.17"
percent-encoding = "2"
proxy-clash = { path = "proxy-clash" }
proxy-singbox = { path = "proxy-singbox" }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bench]]
name = "pipeline"
harness = false

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
